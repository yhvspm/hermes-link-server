services:
  server:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    network_mode: host
    depends_on:
      model-config-exporter:
        condition: service_started
    env_file:
      - ${HERMES_LINK_SERVER_ENV_FILE:-/dev/null}
      - ${HERMES_LINK_INTERNAL_ENV_FILE:?Set HERMES_LINK_INTERNAL_ENV_FILE to the private generated internal credential file.}
    environment:
      HERMES_LINK_PAIRING_DB: /var/lib/hermes-link-server/pairing.db
      HERMES_LINK_DIRECT_EVENT_DB: /var/lib/hermes-link-server/direct-events.db
      HERMES_HOME: /var/lib/hermes-agent
      HERMES_LINK_AGENT_HOME: /var/lib/hermes-agent
      HERMES_LINK_PROFILE_IDS: ${HERMES_LINK_PROFILE_IDS:-}
      HERMES_LINK_REDACTED_LOG_DIR: /var/lib/hermes-link-server/redacted-logs
      HERMES_LINK_MODEL_CONFIG_DIR: /var/lib/hermes-link-server/model-config
      HERMES_LINK_BIND_HOST: ${HERMES_LINK_BIND_HOST:-0.0.0.0}
      HERMES_LINK_BRIDGE_PORT: ${HERMES_LINK_BRIDGE_PORT:-8765}
    volumes:
      - hermes-link-state:/var/lib/hermes-link-server
      - hermes-link-model-config:/var/lib/hermes-link-server/model-config:ro
      - ${HERMES_HOME_HOST_PATH:?Set HERMES_HOME_HOST_PATH to the Hermes metadata directory.}:/var/lib/hermes-agent:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    restart: unless-stopped

  model-config-exporter:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    network_mode: none
    user: "0:0"
    environment:
      HERMES_HOME: /var/lib/hermes-agent
      HERMES_LINK_PROFILE_IDS: ${HERMES_LINK_PROFILE_IDS:-}
      HERMES_LINK_MODEL_CONFIG_DIR: /var/lib/hermes-link-server/model-config
      HERMES_LINK_MODEL_CONFIG_UID: "0"
      HERMES_LINK_MODEL_CONFIG_GID: "10001"
    volumes:
      - hermes-link-model-config:/var/lib/hermes-link-server/model-config
      - ${HERMES_HOME_HOST_PATH:?Set HERMES_HOME_HOST_PATH to the Hermes metadata directory.}:/var/lib/hermes-agent:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    command: ["python", "-m", "hermes_link.integrations.hermes_agent.model_config_exporter"]
    restart: unless-stopped

  log-exporter:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    network_mode: none
    user: "0:0"
    environment:
      HERMES_LINK_RAW_LOG_DIR: /var/lib/hermes-agent-logs
      HERMES_LINK_REDACTED_LOG_DIR: /var/lib/hermes-link-server/redacted-logs
    volumes:
      - hermes-link-state:/var/lib/hermes-link-server
      - ${HERMES_HOME_HOST_PATH:?Set HERMES_HOME_HOST_PATH to the Hermes metadata directory.}/logs:/var/lib/hermes-agent-logs:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    command: ["python", "-m", "hermes_link.observability.redacted_logs"]
    restart: unless-stopped

volumes:
  hermes-link-state:
  hermes-link-model-config:
