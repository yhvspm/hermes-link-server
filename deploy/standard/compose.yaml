services:
  server:
    image: ${HERMES_LINK_IMAGE:?Set HERMES_LINK_IMAGE in the generated .env file.}
    network_mode: host
    env_file:
      - ${HERMES_LINK_INTERNAL_ENV_FILE:?Set HERMES_LINK_INTERNAL_ENV_FILE to the root-only Agent credential file.}
    environment:
      HERMES_HOME: /var/lib/hermes-agent
      HERMES_LINK_AGENT_HOME: /var/lib/hermes-agent
      HERMES_LINK_BRIDGE_PORT: ${HERMES_LINK_BRIDGE_PORT:?Set HERMES_LINK_BRIDGE_PORT through install.sh.}
      HERMES_LINK_PROFILE_IDS: ${HERMES_LINK_PROFILE_IDS:?Set HERMES_LINK_PROFILE_IDS through install.sh or hermes-link sync.}
      HERMES_LINK_PAIRING_DB: /var/lib/hermes-link-server/pairing.db
      HERMES_LINK_SERVER_IDENTITY_FILE: /var/lib/hermes-link-server/server-identity.json
      HERMES_LINK_CLOUD_CONFIG_FILE: /var/lib/hermes-link-server/cloud-config.json
      HERMES_LINK_REDACTED_LOG_DIR: /var/lib/hermes-link-server/redacted-logs
    volumes:
      - ./data/server:/var/lib/hermes-link-server
      - ${HERMES_LINK_AGENT_HOME_HOST:?Set HERMES_LINK_AGENT_HOME_HOST to the local Hermes metadata directory.}:/var/lib/hermes-agent:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from urllib.request import urlopen; port=os.environ['HERMES_LINK_BRIDGE_PORT']; assert urlopen(f'http://127.0.0.1:{port}/health', timeout=3).status == 200"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    restart: unless-stopped

  log-exporter:
    image: ${HERMES_LINK_IMAGE:?Set HERMES_LINK_IMAGE in the generated .env file.}
    network_mode: none
    user: "0:0"
    environment:
      HERMES_LINK_RAW_LOG_DIR: /var/lib/hermes-agent-logs
      HERMES_LINK_REDACTED_LOG_DIR: /var/lib/hermes-link-server/redacted-logs
    volumes:
      - ./data/server:/var/lib/hermes-link-server
      - ${HERMES_LINK_AGENT_HOME_HOST:?Set HERMES_LINK_AGENT_HOME_HOST to the local Hermes metadata directory.}/logs:/var/lib/hermes-agent-logs:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    command: ["python", "-m", "hermes_link.observability.redacted_logs"]
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    network_mode: host
    depends_on:
      server:
        condition: service_healthy
    profiles: ["caddy"]
    environment:
      HERMES_LINK_PUBLIC_HOST: ${HERMES_LINK_PUBLIC_HOST:?Set HERMES_LINK_PUBLIC_HOST in the generated .env file.}
      HERMES_LINK_PUBLIC_PORT: ${HERMES_LINK_PUBLIC_PORT:?Set HERMES_LINK_PUBLIC_PORT in the generated .env file.}
      HERMES_LINK_BRIDGE_PORT: ${HERMES_LINK_BRIDGE_PORT:?Set HERMES_LINK_BRIDGE_PORT through install.sh.}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    restart: unless-stopped
