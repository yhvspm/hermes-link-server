[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-link-server"
version = "1.0.1"
description = "Self-hosted compatibility boundary between Hermes Link clients and Hermes Agent"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "PyYAML>=6", "qrcode>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
