name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Python unit and protocol tests
        run: python -m unittest discover -s tests -t . -p 'test_*.py'
      - name: Cross-repository wire contract tests
        run: python -m unittest tests.test_contracts
      - name: Hermes compatibility boundary
        run: python scripts/architecture_gate.py
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Current-tree public release gate
        run: python scripts/public_release_gate.py --current-only
      - name: Standard installer and custom-port smoke test
        run: |
          bash -n install.sh
          bash -n deploy/standard/bin/hermes-link
          bash install.sh --dry-run --source-dir "$PWD" --host hermes.example.com --public-port 18443 --agent-user runner --hermes-home /tmp/runner/.hermes
      - name: Standard Compose validation
        run: |
          printf 'HERMES_LINK_MOBILE_API_TOKEN=example-internal-credential\n' > .ci-internal-agent.env
          cp .env.example .ci-standard.env
          sed -i "s|^HERMES_LINK_INTERNAL_ENV_FILE=.*|HERMES_LINK_INTERNAL_ENV_FILE=$PWD/.ci-internal-agent.env|" .ci-standard.env
          docker compose --env-file .ci-standard.env -f deploy/standard/compose.yaml config
          docker run --rm \
            -e HERMES_LINK_PUBLIC_HOST=hermes.example.com \
            -e HERMES_LINK_PUBLIC_PORT=18443 \
            -e HERMES_LINK_LISTEN_PORT=18443 \
            -e HERMES_LINK_TLS_DIRECTIVE= \
            -v "$PWD/deploy/standard/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          mkdir -p .ci-caddy-data/manual-tls
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout .ci-caddy-data/manual-tls/privkey.pem \
            -out .ci-caddy-data/manual-tls/fullchain.pem \
            -days 1 -subj '/CN=hermes.example.com' >/dev/null 2>&1
          docker run --rm \
            -e HERMES_LINK_PUBLIC_HOST=hermes.example.com \
            -e HERMES_LINK_PUBLIC_PORT=34443 \
            -e HERMES_LINK_LISTEN_PORT=443 \
            -e 'HERMES_LINK_TLS_DIRECTIVE=tls /data/manual-tls/fullchain.pem /data/manual-tls/privkey.pem' \
            -v "$PWD/deploy/standard/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/.ci-caddy-data:/data:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Docker image smoke test
        run: |
          docker build --file deploy/docker/Dockerfile --tag hermes-link-server:ci .
          docker run --rm --network host -e HERMES_LINK_BRIDGE_PORT=18765 hermes-link-server:ci sh -ec '
            python -m hermes_link.integrations.hermes_agent.bridge &
            child=$!
            trap "kill $child" EXIT
            for attempt in $(seq 1 15); do
              if python -c "from urllib.request import urlopen; assert urlopen(\"http://127.0.0.1:18765/health\", timeout=2).status == 200"; then
                exit 0
              fi
              sleep 1
            done
            exit 1
          '
